[project]
name = "wxpush"
version = "0.1.0"
description = "企业微信应用消息推送后台：应用 / 模板 / webhook / 历史"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27",
]

[project.scripts]
wxpush = "wxpush.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wxpush"]

[tool.setuptools.package-data]
wxpush = ["static/*", "static/*/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# B008：FastAPI 的 Depends(...) 就是写在参数默认值里的，这条规则对它不适用
# RUF001/2/3：注释与文案就是中文，全角标点是正常的
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
